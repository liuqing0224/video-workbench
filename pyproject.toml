[project]
name = "video-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1", "jsonschema>=4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6,<7"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
